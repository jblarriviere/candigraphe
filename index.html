<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCU Vocabulaire — Entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f2ede2;
    --paper-2: #e8e0cf;
    --ink: #2a2420;
    --ink-soft: #55483d;
    --burgundy: #7a2e2e;
    --burgundy-deep: #5c2222;
    --gold: #a9812f;
    --green: #3f6b3a;
    --green-bg: #e3ecdd;
    --red: #a13a2f;
    --red-bg: #f3e0dc;
    --rule: #c9bda3;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 118px, rgba(169,129,47,0.05) 119px),
      radial-gradient(ellipse at top left, rgba(122,46,46,0.04), transparent 60%);
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.masthead {
    text-align: center;
    border-bottom: 3px double var(--ink);
    padding-bottom: 18px;
    margin-bottom: 8px;
  }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--burgundy);
    margin-bottom: 6px;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 22px 0 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .stats-bar .stat b {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--ink);
    font-weight: 600;
  }
  .stats-bar .stat { text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }

  .card {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 40px 36px;
    position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 12px 30px -18px rgba(42,36,32,0.35);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid rgba(122,46,46,0.15);
    border-radius: 2px;
    pointer-events: none;
  }

  .qnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .word {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 46px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--burgundy-deep);
  }

  .instruction {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 15px 18px;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .option .letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    flex-shrink: 0;
  }
  .option:hover:not(:disabled) {
    border-color: var(--burgundy);
    background: #fbf8ee;
  }
  .option:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }
  .option:disabled { cursor: default; }

  .option.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: #2c4a28;
  }
  .option.correct .letter { color: var(--green); }

  .option.incorrect {
    background: var(--red-bg);
    border-color: var(--red);
    color: #6d2419;
  }
  .option.incorrect .letter { color: var(--red); }

  .option.dimmed { opacity: 0.55; }

  .feedback-row {
    margin-top: 24px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .feedback-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .feedback-text.ok { color: var(--green); }
  .feedback-text.ko { color: var(--red); }

  button.next {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--burgundy);
    color: var(--paper);
    border: none;
    border-radius: var(--radius);
    padding: 13px 24px;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  button.next:hover { background: var(--burgundy-deep); }
  button.next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.next:disabled {
    background: var(--rule);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .controls-panel {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 22px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-group-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }

  .control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .control-actions {
    display: flex;
    gap: 12px;
  }

  .control-action {
    background: none;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 2px;
  }
  .control-action:hover { color: var(--burgundy); }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 7px 13px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    cursor: pointer;
    background: var(--paper);
    color: var(--ink-soft);
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  .pill input { display: none; }
  .pill.active {
    border-color: var(--burgundy);
    background: rgba(122,46,46,0.08);
    color: var(--ink);
  }
  .pill:hover { border-color: var(--burgundy); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .setup-start {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    padding: 32px 36px;
  }

  .setup-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .results-card {
    text-align: center;
  }
  .results-card .feedback-row {
    justify-content: center;
    margin-top: 28px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .page { padding: 32px 14px 60px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <div class="kicker">Entraînement personnel</div>
    <h1 class="title">Questionnaire de Vocabulaire</h1>
    <div class="subtitle">— à choix unique · une définition parmi quatre —</div>
  </header>

  <div id="app"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
