<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCU Vocabulaire — Entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f2ede2;
    --paper-2: #e8e0cf;
    --ink: #2a2420;
    --ink-soft: #55483d;
    --burgundy: #7a2e2e;
    --burgundy-deep: #5c2222;
    --gold: #a9812f;
    --green: #3f6b3a;
    --green-bg: #e3ecdd;
    --red: #a13a2f;
    --red-bg: #f3e0dc;
    --rule: #c9bda3;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 118px, rgba(169,129,47,0.05) 119px),
      radial-gradient(ellipse at top left, rgba(122,46,46,0.04), transparent 60%);
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.masthead {
    text-align: center;
    border-bottom: 3px double var(--ink);
    padding-bottom: 18px;
    margin-bottom: 8px;
  }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--burgundy);
    margin-bottom: 6px;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 22px 0 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .stats-bar .stat b {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--ink);
    font-weight: 600;
  }
  .stats-bar .stat { text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }

  .card {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 40px 36px;
    position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 12px 30px -18px rgba(42,36,32,0.35);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid rgba(122,46,46,0.15);
    border-radius: 2px;
    pointer-events: none;
  }

  .qnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .word {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 46px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--burgundy-deep);
  }

  .instruction {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 15px 18px;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .option .letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    flex-shrink: 0;
  }
  .option:hover:not(:disabled) {
    border-color: var(--burgundy);
    background: #fbf8ee;
  }
  .option:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }
  .option:disabled { cursor: default; }

  .option.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: #2c4a28;
  }
  .option.correct .letter { color: var(--green); }

  .option.incorrect {
    background: var(--red-bg);
    border-color: var(--red);
    color: #6d2419;
  }
  .option.incorrect .letter { color: var(--red); }

  .option.dimmed { opacity: 0.55; }

  .feedback-row {
    margin-top: 24px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .feedback-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .feedback-text.ok { color: var(--green); }
  .feedback-text.ko { color: var(--red); }

  button.next {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--burgundy);
    color: var(--paper);
    border: none;
    border-radius: var(--radius);
    padding: 13px 24px;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  button.next:hover { background: var(--burgundy-deep); }
  button.next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .controls-panel {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 22px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-group-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }

  .control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .control-actions {
    display: flex;
    gap: 12px;
  }

  .control-action {
    background: none;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 2px;
  }
  .control-action:hover { color: var(--burgundy); }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 7px 13px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    cursor: pointer;
    background: var(--paper);
    color: var(--ink-soft);
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  .pill input { display: none; }
  .pill.active {
    border-color: var(--burgundy);
    background: rgba(122,46,46,0.08);
    color: var(--ink);
  }
  .pill:hover { border-color: var(--burgundy); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-style: italic;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .page { padding: 32px 14px 60px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <div class="kicker">Entraînement personnel</div>
    <h1 class="title">Questionnaire de Vocabulaire</h1>
    <div class="subtitle">— à choix unique · une définition parmi quatre —</div>
  </header>

  <div class="stats-bar">
    <div class="stat"><b id="stat-score">0</b>Score</div>
    <div class="stat"><b id="stat-total">0</b>Répondues</div>
    <div class="stat"><b id="stat-streak">0</b>Série</div>
  </div>

  <div class="controls-panel" id="controls-panel">
    <div class="control-group" data-control="type">
      <div class="control-group-header">
        <span class="control-label">Type de mot</span>
      </div>
      <div class="pill-group" id="type-filter-group">
        <label class="pill"><input type="checkbox" value="nom" checked><span>Nom</span></label>
        <label class="pill"><input type="checkbox" value="adjectif" checked><span>Adjectif</span></label>
        <label class="pill"><input type="checkbox" value="adverbe" checked><span>Adverbe</span></label>
        <label class="pill"><input type="checkbox" value="verbe" checked><span>Verbe</span></label>
      </div>
    </div>
    <div class="control-group" data-control="letter">
      <div class="control-group-header">
        <span class="control-label">Lettre initiale</span>
        <div class="control-actions">
          <button type="button" class="control-action" id="letter-select-all">Tout sélectionner</button>
          <button type="button" class="control-action" id="letter-select-none">Tout désélectionner</button>
        </div>
      </div>
      <div class="pill-group" id="letter-filter-group"></div>
    </div>
  </div>

  <div id="quiz-area"></div>

</div>

<script>
(function(){

  // ---- Banque de mots importée depuis words_list.json ----
  // Chaque mot porte un "type" (nom / adjectif / adverbe / verbe) : les fausses
  // définitions du quiz sont piochées en priorité parmi les mots de même type,
  // pour éviter qu'on élimine une réponse juste parce qu'elle est du mauvais genre.
  const WORDS_JSON_URL = "words_list.json";
  let importedWords = [];

  let bank = [];
  let current = null;
  let score = 0, total = 0, streak = 0;
  let answered = false;

  // ---- Contrôles ----
  // État des filtres actifs. Pensé pour accueillir d'autres contrôles plus tard :
  // chaque groupe de contrôle a sa propre entrée ici, et rebuildBank() applique
  // tous les filtres actifs les uns après les autres. Un filtre vide exclut tout
  // (rebuildBank produira une banque vide, géré par renderEmpty).
  const filters = {
    types: new Set(['nom', 'adjectif', 'adverbe', 'verbe']),
    letters: new Set(), // rempli dynamiquement une fois les mots chargés
  };

  // Lettre initiale normalisée (sans accent) d'un mot, ex. "ÉPARS" -> "E".
  function startingLetter(word) {
    return word.normalize('NFD').replace(/[\u0300-\u036f]/g, '')[0].toUpperCase();
  }

  const quizArea = document.getElementById('quiz-area');
  const statScore = document.getElementById('stat-score');
  const statTotal = document.getElementById('stat-total');
  const statStreak = document.getElementById('stat-streak');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rebuildBank() {
    bank = importedWords.filter(w =>
      filters.types.has(w.type) && filters.letters.has(startingLetter(w.word))
    );
  }

  function updateStats() {
    statScore.textContent = score;
    statTotal.textContent = total;
    statStreak.textContent = streak;
  }

  function renderEmpty() {
    const message = importedWords.length === 0
      ? "Impossible de charger la liste de mots. Essaie de recharger la page."
      : "Pas assez de mots pour ces filtres. Essaie d'en sélectionner d'autres.";
    quizArea.innerHTML = `<div class="card"><div class="empty-state">${message}</div></div>`;
  }

  function newQuestion() {
    if (bank.length < 4) { renderEmpty(); return; }
    answered = false;
    const item = bank[Math.floor(Math.random() * bank.length)];

    // Génère 3 fausses définitions à la volée, piochées parmi les autres
    // définitions de la banque (jamais stockées : recalculées à chaque question).
    // On préfère piocher parmi les mots de même type grammatical (nom/adjectif/
    // adverbe/verbe) pour ne pas trahir la réponse par élimination de genre ;
    // si la banque n'en contient pas assez (mot sans type, petite banque), on
    // retombe sur l'ensemble de la banque comme avant.
    const pool = bank.filter(w => w.word !== item.word);
    const sameTypePool = item.type ? pool.filter(w => w.type === item.type) : [];
    const distractorPool = sameTypePool.length >= 3 ? sameTypePool : pool;
    const wrongDefs = shuffle(distractorPool).slice(0, 3).map(w => w.correct);

    const options = shuffle([
      { text: item.correct, correct: true },
      ...wrongDefs.map(d => ({ text: d, correct: false }))
    ]);
    current = { item, options };
    renderQuestion();
  }

  function renderQuestion() {
    const letters = ['A', 'B', 'C', 'D'];
    quizArea.innerHTML = `
      <div class="card">
        <div class="qnum">Question ${total + 1}</div>
        <div class="word">${escapeHtml(current.item.word)}</div>
        <div class="instruction">Quelle est la définition correcte de ce mot ?</div>
        <div class="options" id="options-list">
          ${current.options.map((o, i) => `
            <button class="option" data-index="${i}">
              <span class="letter">${letters[i]}</span>
              <span>${escapeHtml(o.text)}</span>
            </button>
          `).join('')}
        </div>
        <div class="feedback-row">
          <div class="feedback-text" id="feedback-text"></div>
          <button class="next" id="next-btn" style="display:none;">Question suivante →</button>
        </div>
      </div>
    `;
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', onAnswer);
    });
    document.getElementById('next-btn').addEventListener('click', newQuestion);
  }

  function onAnswer(e) {
    if (answered) return;
    answered = true;
    const idx = parseInt(e.currentTarget.getAttribute('data-index'), 10);
    const chosen = current.options[idx];
    total++;

    document.querySelectorAll('.option').forEach((btn, i) => {
      btn.disabled = true;
      const opt = current.options[i];
      if (opt.correct) {
        btn.classList.add('correct');
      } else if (i === idx) {
        btn.classList.add('incorrect');
      } else {
        btn.classList.add('dimmed');
      }
    });

    const feedback = document.getElementById('feedback-text');
    if (chosen.correct) {
      score++;
      streak++;
      feedback.textContent = "✓ Exact.";
      feedback.className = "feedback-text ok";
    } else {
      streak = 0;
      feedback.textContent = "✗ Ce n'était pas la bonne définition — regarde celle en vert.";
      feedback.className = "feedback-text ko";
    }
    document.getElementById('next-btn').style.display = 'inline-block';
    updateStats();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Câblage générique des groupes de contrôle (pills à cocher) ----
  // Chaque groupe pilote un Set de filters. Un groupe vide n'est pas empêché :
  // rebuildBank() donnera alors une banque vide, et renderEmpty() l'explique.
  function setupToggleGroup(containerEl, selectedSet, onChange) {
    containerEl.querySelectorAll('.pill input').forEach(input => {
      input.closest('.pill').classList.toggle('active', input.checked);
      input.addEventListener('change', () => {
        if (input.checked) selectedSet.add(input.value);
        else selectedSet.delete(input.value);
        input.closest('.pill').classList.toggle('active', input.checked);
        onChange();
      });
    });
  }

  function setAllPills(containerEl, selectedSet, allValues, selected) {
    selectedSet.clear();
    if (selected) allValues.forEach(v => selectedSet.add(v));
    containerEl.querySelectorAll('.pill').forEach(pill => {
      const input = pill.querySelector('input');
      input.checked = selected;
      pill.classList.toggle('active', selected);
    });
  }

  // ---- Groupe de contrôle : type de mot ----
  setupToggleGroup(document.getElementById('type-filter-group'), filters.types, () => {
    rebuildBank();
    newQuestion();
  });

  // ---- Groupe de contrôle : lettre initiale ----
  // Construit dynamiquement une fois les mots chargés, une pill par lettre
  // effectivement présente dans la banque (pas de pill morte pour W, X...).
  function setupLetterFilter() {
    const letters = [...new Set(importedWords.map(w => startingLetter(w.word)))].sort();
    filters.letters = new Set(letters);

    const group = document.getElementById('letter-filter-group');
    group.innerHTML = letters.map(l =>
      `<label class="pill"><input type="checkbox" value="${l}" checked><span>${l}</span></label>`
    ).join('');

    setupToggleGroup(group, filters.letters, () => {
      rebuildBank();
      newQuestion();
    });

    document.getElementById('letter-select-all').addEventListener('click', () => {
      setAllPills(group, filters.letters, letters, true);
      rebuildBank();
      newQuestion();
    });
    document.getElementById('letter-select-none').addEventListener('click', () => {
      setAllPills(group, filters.letters, letters, false);
      rebuildBank();
      newQuestion();
    });
  }

  async function loadImportedWords() {
    try {
      const res = await fetch(WORDS_JSON_URL);
      const json = await res.json();
      importedWords = json.data || [];
    } catch (e) {
      console.error("Impossible de charger words_list.json :", e);
      importedWords = [];
    }
  }

  async function init() {
    await loadImportedWords();
    setupLetterFilter();
    rebuildBank();
    newQuestion();
  }

  init();

})();
</script>

</body>
</html>
